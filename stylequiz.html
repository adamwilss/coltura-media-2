<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel style quiz · Coltura</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,700;1,6..72,700&display=swap" rel="stylesheet">
<style>
:root{--night:#070909;--cream:#f9f4f1;--red:#fe3a35;--muted:#8a8580}
*{box-sizing:border-box}body{margin:0;background:var(--night);color:var(--cream);font-family:Newsreader,Georgia,serif}
header{padding:18px 18px 6px}h1{font-size:26px;margin:0;font-weight:700}h1 i{color:var(--red)}
.sub{color:var(--muted);font:14px/1.4 -apple-system,system-ui,sans-serif;margin-top:6px}
.bar{height:4px;background:#1c1f1f;margin:12px 18px 0;border-radius:2px}.bar b{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 18px 24px}@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr)}}
.opt{position:relative;border:2px solid #1c1f1f;border-radius:10px;overflow:hidden;cursor:pointer;background:#111}
.opt img{width:100%;display:block;image-rendering:pixelated}.opt span{position:absolute;left:8px;top:6px;font:700 15px -apple-system,system-ui;background:rgba(7,9,9,.75);padding:2px 8px;border-radius:6px}
.opt.sel{border-color:var(--red);transform:scale(.98)}
.nav{display:flex;justify-content:space-between;padding:0 18px 18px}button{font:600 15px -apple-system,system-ui;background:#1c1f1f;color:var(--cream);border:0;border-radius:999px;padding:10px 16px}
button.red{background:var(--red)}.res{padding:6px 18px 30px}.row{display:flex;align-items:center;gap:10px;margin:8px 0;font:15px -apple-system,system-ui}
.row .n{width:130px}.row .b{height:14px;background:var(--red);border-radius:3px}.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}.picks img{width:100%;image-rendering:pixelated;border-radius:6px}
textarea{width:100%;height:120px;margin-top:12px;background:#111;color:var(--cream);border:1px solid #333;border-radius:8px;font:12px monospace}
</style></head><body>
<header><h1>pick the one you <i>like.</i></h1><div class="sub" id="q"></div></header><div class="bar"><b id="prog"></b></div>
<div class="grid" id="grid"></div><div class="nav"><button id="back">back</button><button id="skip">none of these</button></div>
<div class="res" id="res" hidden></div>
<script>
const D={"styles": {"nes": "NES 8-bit", "snes": "16-bit", "hd2d": "HD-2D painterly", "modern": "modern minimal", "cozy": "cozy", "gothic": "gothic", "arabic": "Arabic geometric", "neon": "neon", "gameboy": "Game Boy", "onebit": "1-bit", "sepia": "sepia", "chinese": "ink wash", "coltura": "Coltura colours", "amber": "amber CRT"}, "questions": [{"object": "a house", "options": [{"style": "gothic", "img": "stylequiz-house-gothic.png"}, {"style": "hd2d", "img": "stylequiz-house-hd2d.png"}, {"style": "nes", "img": "stylequiz-house-nes.png"}, {"style": "snes", "img": "stylequiz-house-snes.png"}, {"style": "modern", "img": "stylequiz-house-modern.png"}]}, {"object": "a plant", "options": [{"style": "gameboy", "img": "stylequiz-plant-gameboy.png"}, {"style": "gothic", "img": "stylequiz-plant-gothic.png"}, {"style": "neon", "img": "stylequiz-plant-neon.png"}, {"style": "modern", "img": "stylequiz-plant-modern.png"}, {"style": "arabic", "img": "stylequiz-plant-arabic.png"}]}, {"object": "a picture frame", "options": [{"style": "gothic", "img": "stylequiz-frame-gothic.png"}, {"style": "sepia", "img": "stylequiz-frame-sepia.png"}, {"style": "amber", "img": "stylequiz-frame-amber.png"}, {"style": "coltura", "img": "stylequiz-frame-coltura.png"}, {"style": "chinese", "img": "stylequiz-frame-chinese.png"}]}, {"object": "a desk lamp", "options": [{"style": "hd2d", "img": "stylequiz-lamp-hd2d.png"}, {"style": "snes", "img": "stylequiz-lamp-snes.png"}, {"style": "modern", "img": "stylequiz-lamp-modern.png"}, {"style": "gothic", "img": "stylequiz-lamp-gothic.png"}, {"style": "cozy", "img": "stylequiz-lamp-cozy.png"}]}, {"object": "an armchair", "options": [{"style": "gothic", "img": "stylequiz-armchair-gothic.png"}, {"style": "gameboy", "img": "stylequiz-armchair-gameboy.png"}, {"style": "onebit", "img": "stylequiz-armchair-onebit.png"}, {"style": "neon", "img": "stylequiz-armchair-neon.png"}, {"style": "arabic", "img": "stylequiz-armchair-arabic.png"}]}, {"object": "a front door", "options": [{"style": "modern", "img": "stylequiz-door-modern.png"}, {"style": "coltura", "img": "stylequiz-door-coltura.png"}, {"style": "chinese", "img": "stylequiz-door-chinese.png"}, {"style": "nes", "img": "stylequiz-door-nes.png"}, {"style": "amber", "img": "stylequiz-door-amber.png"}]}, {"object": "a coffee cup", "options": [{"style": "hd2d", "img": "stylequiz-cup-hd2d.png"}, {"style": "gothic", "img": "stylequiz-cup-gothic.png"}, {"style": "cozy", "img": "stylequiz-cup-cozy.png"}, {"style": "modern", "img": "stylequiz-cup-modern.png"}, {"style": "arabic", "img": "stylequiz-cup-arabic.png"}]}, {"object": "a bicycle", "options": [{"style": "sepia", "img": "stylequiz-bicycle-sepia.png"}, {"style": "gameboy", "img": "stylequiz-bicycle-gameboy.png"}, {"style": "modern", "img": "stylequiz-bicycle-modern.png"}, {"style": "neon", "img": "stylequiz-bicycle-neon.png"}, {"style": "onebit", "img": "stylequiz-bicycle-onebit.png"}]}, {"object": "a tree", "options": [{"style": "gothic", "img": "stylequiz-tree-gothic.png"}, {"style": "nes", "img": "stylequiz-tree-nes.png"}, {"style": "snes", "img": "stylequiz-tree-snes.png"}, {"style": "amber", "img": "stylequiz-tree-amber.png"}, {"style": "coltura", "img": "stylequiz-tree-coltura.png"}]}, {"object": "a wall clock", "options": [{"style": "cozy", "img": "stylequiz-clock-cozy.png"}, {"style": "arabic", "img": "stylequiz-clock-arabic.png"}, {"style": "neon", "img": "stylequiz-clock-neon.png"}, {"style": "gothic", "img": "stylequiz-clock-gothic.png"}, {"style": "modern", "img": "stylequiz-clock-modern.png"}]}, {"object": "a window", "options": [{"style": "gameboy", "img": "stylequiz-window-gameboy.png"}, {"style": "sepia", "img": "stylequiz-window-sepia.png"}, {"style": "chinese", "img": "stylequiz-window-chinese.png"}, {"style": "onebit", "img": "stylequiz-window-onebit.png"}, {"style": "gothic", "img": "stylequiz-window-gothic.png"}]}, {"object": "a laptop", "options": [{"style": "nes", "img": "stylequiz-laptop-nes.png"}, {"style": "hd2d", "img": "stylequiz-laptop-hd2d.png"}, {"style": "amber", "img": "stylequiz-laptop-amber.png"}, {"style": "modern", "img": "stylequiz-laptop-modern.png"}, {"style": "snes", "img": "stylequiz-laptop-snes.png"}]}, {"object": "a phone", "options": [{"style": "gothic", "img": "stylequiz-phone-gothic.png"}, {"style": "arabic", "img": "stylequiz-phone-arabic.png"}, {"style": "cozy", "img": "stylequiz-phone-cozy.png"}, {"style": "neon", "img": "stylequiz-phone-neon.png"}, {"style": "gameboy", "img": "stylequiz-phone-gameboy.png"}]}, {"object": "a shopfront", "options": [{"style": "sepia", "img": "stylequiz-shop-sepia.png"}, {"style": "modern", "img": "stylequiz-shop-modern.png"}, {"style": "onebit", "img": "stylequiz-shop-onebit.png"}, {"style": "coltura", "img": "stylequiz-shop-coltura.png"}, {"style": "chinese", "img": "stylequiz-shop-chinese.png"}]}, {"object": "a key", "options": [{"style": "snes", "img": "stylequiz-key-snes.png"}, {"style": "nes", "img": "stylequiz-key-nes.png"}, {"style": "gothic", "img": "stylequiz-key-gothic.png"}, {"style": "hd2d", "img": "stylequiz-key-hd2d.png"}, {"style": "modern", "img": "stylequiz-key-modern.png"}]}, {"object": "an envelope", "options": [{"style": "gameboy", "img": "stylequiz-envelope-gameboy.png"}, {"style": "neon", "img": "stylequiz-envelope-neon.png"}, {"style": "gothic", "img": "stylequiz-envelope-gothic.png"}, {"style": "arabic", "img": "stylequiz-envelope-arabic.png"}, {"style": "modern", "img": "stylequiz-envelope-modern.png"}]}, {"object": "a toolbox", "options": [{"style": "chinese", "img": "stylequiz-toolbox-chinese.png"}, {"style": "sepia", "img": "stylequiz-toolbox-sepia.png"}, {"style": "amber", "img": "stylequiz-toolbox-amber.png"}, {"style": "gothic", "img": "stylequiz-toolbox-gothic.png"}, {"style": "coltura", "img": "stylequiz-toolbox-coltura.png"}]}, {"object": "a kettle", "options": [{"style": "snes", "img": "stylequiz-kettle-snes.png"}, {"style": "modern", "img": "stylequiz-kettle-modern.png"}, {"style": "gothic", "img": "stylequiz-kettle-gothic.png"}, {"style": "hd2d", "img": "stylequiz-kettle-hd2d.png"}, {"style": "cozy", "img": "stylequiz-kettle-cozy.png"}]}, {"object": "a bookshelf", "options": [{"style": "gothic", "img": "stylequiz-bookshelf-gothic.png"}, {"style": "gameboy", "img": "stylequiz-bookshelf-gameboy.png"}, {"style": "neon", "img": "stylequiz-bookshelf-neon.png"}, {"style": "onebit", "img": "stylequiz-bookshelf-onebit.png"}, {"style": "arabic", "img": "stylequiz-bookshelf-arabic.png"}]}, {"object": "a street lamp", "options": [{"style": "chinese", "img": "stylequiz-streetlamp-chinese.png"}, {"style": "nes", "img": "stylequiz-streetlamp-nes.png"}, {"style": "modern", "img": "stylequiz-streetlamp-modern.png"}, {"style": "coltura", "img": "stylequiz-streetlamp-coltura.png"}, {"style": "amber", "img": "stylequiz-streetlamp-amber.png"}]}]};const K='colturaStyleQuiz1';let ans=JSON.parse(localStorage.getItem(K)||'{}');let i=0;
const L='ABCDE';const qs=D.questions;
function show(){if(i>=qs.length)return results();const q=qs[i];document.getElementById('q').textContent=`${i+1} of ${qs.length} · ${q.object}`;
document.getElementById('prog').style.width=(100*i/qs.length)+'%';const g=document.getElementById('grid');g.hidden=false;document.getElementById('res').hidden=true;g.innerHTML='';
q.options.forEach((o,j)=>{const d=document.createElement('div');d.className='opt'+(ans[i]===j?' sel':'');d.innerHTML=`<img src="${o.img}?v=2" alt="" onerror="if(!this.dataset.r){this.dataset.r=1;setTimeout(()=>{this.src=this.src.split('?')[0]+'?v='+Date.now()},800)}"><span>${L[j]}</span>`;
d.onclick=()=>{ans[i]=j;localStorage.setItem(K,JSON.stringify(ans));d.classList.add('sel');setTimeout(()=>{i++;show()},250)};g.appendChild(d)})}
function results(){document.getElementById('grid').hidden=true;document.getElementById('prog').style.width='100%';document.getElementById('q').textContent='done. here is what you picked.';
const c={},shown={};qs.forEach((q,qi)=>{q.options.forEach(o=>shown[o.style]=(shown[o.style]||0)+1);if(ans[qi]>=0){const s=q.options[ans[qi]].style;c[s]=(c[s]||0)+1}});
const rows=Object.keys(D.styles).map(s=>[s,c[s]||0,shown[s]||0]).sort((a,b)=>b[1]/b[2]-a[1]/a[2]||b[1]-a[1]);
let h='';rows.forEach(([s,n,t])=>{h+=`<div class="row"><div class="n">${D.styles[s]}</div><div class="b" style="width:${Math.max(2,160*n/Math.max(1,t))}px"></div><div>${n} of ${t}</div></div>`});
h+='<div class="picks">'+qs.map((q,qi)=>ans[qi]>=0?`<img src="${q.options[ans[qi]].img}">`:'').join('')+'</div>';
const txt='STYLE QUIZ RESULTS\n'+rows.map(([s,n,t])=>`${D.styles[s]}: ${n}/${t}`).join('\n')+'\n\nPICKS\n'+qs.map((q,qi)=>`${qi+1}. ${q.object}: ${ans[qi]>=0?D.styles[q.options[ans[qi]].style]:'none'}`).join('\n');
h+=`<textarea id="t" readonly>${txt}</textarea><div class="nav" style="padding:12px 0"><button class="red" id="copy">copy results</button><button id="again">start again</button></div>`;
const r=document.getElementById('res');r.innerHTML=h;r.hidden=false;
document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(txt).then(()=>document.getElementById('copy').textContent='copied. paste it to Claude.')};
document.getElementById('again').onclick=()=>{ans={};localStorage.removeItem(K);i=0;show()}}
document.getElementById('back').onclick=()=>{if(i>0){i--;show()}};document.getElementById('skip').onclick=()=>{ans[i]=-1;localStorage.setItem(K,JSON.stringify(ans));i++;show()};
qs.forEach(q=>q.options.forEach(o=>{const im=new Image();im.src=o.img+'?v=2'}));
show();
</script></body></html>
